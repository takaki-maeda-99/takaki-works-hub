[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

; Build options
build_flags = 
    -DUSB_SERIAL
    -DTEENSYDUINO=159
    
; Library dependencies
lib_deps = 
    ; Add any libraries you need here
    ; Example: adafruit/Adafruit Sensor @ ^1.1.4

; Upload options
upload_port = ; Will be detected automatically